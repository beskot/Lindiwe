name: Build Native AOT binary (win-11)

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: [self-hosted, win11-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore Lindiwe.slnx

      - name: Publish Native AOT
        shell: pwsh
        run: >
          dotnet publish Lindiwe/Lindiwe.csproj
          -c Release -r win-x64
          -p:PublishAot=true -p:StripSymbols=true -p:InvariantGlobalization=true
          -o ./publish/x64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindiwe-win-x64-${{ github.ref_name }}
          path: ./publish/x64/Lindiwe.exe
          retention-days: 14