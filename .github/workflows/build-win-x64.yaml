name: Build Native AOT binary (win-11)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: [self-hosted, win11-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Lindiwe.slnx

      - name: Publish Native AOT
        shell: powershell
        run: >
          dotnet publish Lindiwe/Lindiwe.csproj
          -c Release -r win-x64
          -p:PublishAot=true
          -p:StripSymbols=true
          -p:InvariantGlobalization=true
          -p:Version="${{ steps.ver.outputs.version }}"
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o ./publish/x64

      - name: Rename release binary
        if: startsWith(github.ref, 'refs/tags/')
        run: mv ./publish/x64/Lindiwe.exe ./publish/x64/Lindiwe-win-x64.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindiwe-win-x64-${{ github.ref_name }}
          path: ./publish/x64/Lindiwe-win-x64.exe
          retention-days: 14
          if-no-files-found: error
      
      # https://github.com/bestkot/Lindiwe/releases/download/<tag>/Lindiwe-win-x64
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: ./publish/x64/Lindiwe-win-x64.exe
          fail_on_unmatched_files: true
          overwrite_files: true