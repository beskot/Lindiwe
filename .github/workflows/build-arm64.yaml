name: Build Native AOT binary (arm64 for Raspberry Pi Zero 2 W)

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: [self-hosted, linux, dotnet-aot-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore Lindiwe.slnx

      - name: Publish Native AOT (linux-arm64)
        run: |
          dotnet publish Lindiwe/Lindiwe.csproj \
            -c Release -r linux-arm64 \
            -p:PublishAot=true -p:StripSymbols=true -p:InvariantGlobalization=true \
            -o ./publish/arm64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindiwe-linux-arm64-${{ github.ref_name }}
          path: ./publish/arm64/Lindiwe
          retention-days: 14