name: Build Native AOT binary (arm64 for Raspberry Pi Zero 2 W)

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, dotnet-aot-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Lindiwe.slnx

      - name: Publish Native AOT (linux-arm64)
        run: |
          dotnet publish Lindiwe/Lindiwe.csproj \
            -c Release \
            -r linux-arm64 \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:InvariantGlobalization=true \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -o ./publish/arm64

      - name: Rename release binary
        if: startsWith(github.ref, 'refs/tags/')
        run: mv ./publish/arm64/Lindiwe ./publish/arm64/Lindiwe-linux-arm64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindiwe-linux-arm64-${{ github.ref_name }}
          path: ./publish/arm64/Lindiwe*
          retention-days: 14
          if-no-files-found: error

      # https://github.com/bestkot/Lindiwe/releases/download/<tag>/Lindiwe-linux-arm64
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: ./publish/arm64/Lindiwe-linux-arm64
          fail_on_unmatched_files: true
          overwrite_files: true